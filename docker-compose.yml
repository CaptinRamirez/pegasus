services:
  postgres:
    image: postgres:16-alpine
    container_name: pegasus-postgres
    environment:
      POSTGRES_USER: pegasus
      POSTGRES_PASSWORD: pegasus
      POSTGRES_DB: pegasus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pegasus"]
      interval: 5s
      timeout: 3s
      retries: 10
